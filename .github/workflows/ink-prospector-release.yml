name: ink-prospector release
# Publish an Ink Prospector release whose notes are that version's CHANGELOG.md section.
# Either push a tag ink-prospector-vX.Y.Z, or run this workflow on main with version X.Y.Z
# (Actions > ink-prospector release > Run workflow), which creates the tag on the commit it runs on.
on:
  push:
    tags: ["ink-prospector-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (needs a '## 0.2.0' section in ink-prospector/CHANGELOG.md)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag name
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then TAG="ink-prospector-v${VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Notes from CHANGELOG.md
        run: python3 ink-prospector/release_notes.py "$TAG" > notes.md
      - name: Folder archive
        run: git archive --format=tar.gz --prefix="$TAG/" -o "$TAG.tar.gz" HEAD ink-prospector
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$TAG.tar.gz" --target "$GITHUB_SHA" --title "Ink Prospector ${TAG#ink-prospector-v}" --notes-file notes.md
